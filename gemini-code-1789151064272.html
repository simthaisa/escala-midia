<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escala de Mídia - Voluntariado</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
  --bg: #0f1318;
  --panel: #1b2129;
  --panel-2: #242c37;
  --text: #e8ecf1;
  --text-dim: #94a3b8;
  --line: #2e3846;
  --amber: #f59e0b;
  --green-wpp: #25d366;
  --green-bg: rgba(37, 211, 102, 0.15);
  --red-bg: #4c1111;
  --red-border: #ef4444;
  --red-text: #fca5a5;
  --radius: 6px;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
}

.wrap { max-width: 1400px; margin: 0 auto; }

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 20px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.header h1 { margin: 0; font-size: 24px; font-weight: 700; }
.actions-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.status-badge {
  font-size: 11px;
  font-weight: 600;
  padding: 5px 10px;
  border-radius: 20px;
  background: var(--panel-2);
  color: var(--text-dim);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.status-badge.saving { color: var(--amber); }
.status-badge.synced { color: #4ade80; }

.btn {
  background: var(--amber);
  color: #111;
  border: none;
  border-radius: var(--radius);
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.btn:hover { opacity: 0.9; }
.btn.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--red-border); border: 1px solid var(--red-border); }

/* Tabs */
.tabs { display: flex; gap: 4px; margin-bottom: 18px; }
.tab-btn {
  background: var(--panel);
  color: var(--text-dim);
  border: 1px solid var(--line);
  padding: 8px 18px;
  font-size: 13px;
  font-weight: 600;
  border-radius: var(--radius);
  cursor: pointer;
}
.tab-btn.active {
  background: var(--amber);
  color: #111;
  border-color: var(--amber);
}

.panel { display: none; }
.panel.active { display: block; }

/* Tabela Planilha */
.table-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow-x: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  min-width: 1150px;
}
th {
  background: var(--panel-2);
  padding: 10px 12px;
  text-align: left;
  font-size: 11px;
  text-transform: uppercase;
  color: var(--text-dim);
  border-bottom: 1px solid var(--line);
}
td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
tr:hover { background: rgba(255,255,255,0.02); }

/* Célula com Select + Botões */
.slot-cell {
  display: flex;
  align-items: center;
  gap: 5px;
}
.cell-select {
  flex: 1;
  min-width: 140px;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 6px 8px;
  border-radius: 4px;
  font-size: 12px;
  outline: none;
  transition: all 0.2s ease;
}
.cell-select:focus { border-color: var(--amber); }

.cell-select.has-conflict {
  background-color: var(--red-bg) !important;
  border: 1px solid var(--red-border) !important;
  color: var(--red-text) !important;
  font-weight: 600;
}

/* Estilos de Confirmação Verde */
.cell-select.is-confirmed {
  background-color: var(--green-bg) !important;
  border-color: var(--green-wpp) !important;
  color: #4ade80 !important;
  font-weight: 700;
}

.btn-check {
  background: var(--panel-2);
  color: var(--text-dim);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 6px 8px;
  font-size: 11px;
  font-weight: 800;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}
.btn-check.active {
  background: var(--green-wpp);
  color: #fff;
  border-color: var(--green-wpp);
}
.btn-check:hover { filter: brightness(1.2); }

.btn-wpp {
  background: var(--green-wpp);
  color: #fff;
  border: none;
  border-radius: 4px;
  padding: 6px 8px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
}
.btn-wpp:hover { filter: brightness(1.1); }

/* Forms e Cards */
.card-box {
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 18px;
  border-radius: var(--radius);
  margin-bottom: 20px;
}
.grid-form {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 12px;
  align-items: end;
}
.field label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  margin-bottom: 4px;
}
input, select {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 8px 10px;
  border-radius: 4px;
  font-size: 13px;
}

/* Seletor de turnos */
.turnos-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(125px, 1fr));
  gap: 8px;
  margin-top: 8px;
}
.turno-card {
  background: var(--bg);
  border: 1px solid var(--line);
  padding: 8px;
  border-radius: 4px;
}
.turno-card-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--amber);
  margin-bottom: 6px;
  text-transform: uppercase;
}
.turno-options {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 11px;
  color: var(--text-dim);
}
.turno-options label {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}
.turno-options input[type="checkbox"] { width: auto; margin: 0; }

.vol-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px;
}
.vol-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
}
.tag {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  background: var(--panel-2);
  color: var(--amber);
  padding: 2px 6px;
  border-radius: 4px;
  margin-right: 4px;
  margin-bottom: 4px;
}
.tag-neutral {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  background: #334155;
  color: #cbd5e1;
  padding: 2px 6px;
  border-radius: 4px;
}
.vol-actions { display: flex; gap: 8px; margin-top: 10px; }
</style>
</head>
<body>

        </div>

        </div>
        <div class="field">
          <label>Horário</label>
          <input type="text" id="ev-horario" placeholder="Ex: 08h às 12h, 19h">
        </div>
        <div class="field">
          <label>Local</label>
          <input type="text" id="ev-local" placeholder="Ex: Base da Social">
        </div>
        <div>
          <button class="btn" onclick="addEventoLinha()">+ Adicionar Linha</button>
        </div>
      </div>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th style="width: 140px;">Data</th>
            <th>Projeto</th>
            <th style="width: 140px;">Horário</th>
            <th>Local</th>

          </tr>
        </thead>
        <tbody id="planilha-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- ABA: VOLUNTARIOS -->

    <div class="card-box">
      <strong style="display:block;margin-bottom:10px;font-size:14px;" id="vol-form-title">Cadastrar Novo Voluntário</strong>
      <div class="grid-form" style="grid-template-columns: 1.5fr 1.2fr 1.5fr 1fr;">
        <div class="field">
          <label>Nome</label>
          <input type="text" id="vol-nome" placeholder="Nome completo">
        </div>
        <div class="field">
          <label>WhatsApp (DDD + Número)</label>
          <input type="text" id="vol-tel" placeholder="Ex: 41999999999">
        </div>
        <div class="field">
          <label>Tags / O que faz (separe por vírgula)</label>
          <input type="text" id="vol-funcoes" placeholder="Ex: Fotografia, Stories, Vídeo">
        </div>
        <div class="field">
          <label>Tipo de Participação</label>
          <select id="vol-edicao">
            <option value="campo">Campo (Aparece na escala)</option>
            <option value="edicao">Apenas Edição de Vídeo</option>
            <option value="parada">Exclusivo Parada Social</option>
          </select>
        </div>
      </div>

      <div style="margin-top:14px; border-top:1px solid var(--line); padding-top:12px;">
        <label style="font-size:12px;font-weight:600;color:var(--text-dim);display:block;margin-bottom:4px;">
          Indisponibilidades de Turno (Marque onde o voluntário <span style="color:var(--red-text);font-weight:700;">NÃO PODE</span> servir):
        </label>
        <div class="turnos-grid" id="turnos-selector"></div>
      </div>

      <div style="margin-top:14px;">
        <div class="field">
          <label>Descrição / Observação</label>
          <input type="text" id="vol-obs" placeholder="Ex: Não pode quintas à noite">
        </div>
      </div>

      <div style="margin-top:16px;">

        <button class="btn secondary" id="vol-cancel-btn" style="display:none;" onclick="cancelarEdicaoVoluntario()">Cancelar Edição</button>

    <h3 style="font-size:16px;margin: 18px 0 12px;">Voluntários Cadastrados</h3>
    <div class="vol-grid" id="voluntarios-list"></div>
  </div>

</div>

async function init() {
  montarSeletorTurnos();
  await carregarDadosNuvem();
}

function setStatus(msg, tipo = '') {
  const el = document.getElementById('sync-status');
  el.textContent = msg;
  el.className = 'status-badge ' + tipo;
}

async function carregarDadosNuvem(manual = false) {
  if (manual) setStatus('● Atualizando dados...', 'saving');

  try {
    const res = await fetch(SCRIPT_URL);
    const data = await res.json();
    if (data && data.eventos && data.voluntarios) {
      eventos = data.eventos;
      voluntarios = data.voluntarios;
    } else {
      eventos = EVENTOS_INICIAIS;
      voluntarios = VOLUNTARIOS_INICIAIS;
      salvarNaNuvem();
    }
    setStatus('● Conectado e Sincronizado', 'synced');
  } catch (err) {
    eventos = EVENTOS_INICIAIS;
    voluntarios = VOLUNTARIOS_INICIAIS;
    setStatus('● Modo offline (erro ao conectar)', 'saving');
  }

  ordenarEventosPorData();
  renderPlanilha();
  renderVoluntarios();
}

let timeoutSalvar = null;
function salvarNaNuvem() {
  setStatus('● Salvando no Drive...', 'saving');
  clearTimeout(timeoutSalvar);

  timeoutSalvar = setTimeout(async () => {
    try {
      const payload = JSON.stringify({ eventos, voluntarios });
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: payload
      });
      setStatus('● Salvo na nuvem', 'synced');
    } catch (err) {
      setStatus('● Erro ao salvar', '');
    }
  }, 600);
}

function ordenarEventosPorData() {
  eventos.sort((a, b) => {
    if (!a.data) return 1;
    if (!b.data) return -1;
    return a.data.localeCompare(b.data);
  });
}

/* Tabs */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'planilha') renderPlanilha();
  });
});

/* Seletor de Turnos */

      <div class="turno-card-title">${d.nome}</div>
      <div class="turno-options">
        <label><input type="checkbox" data-dia="${d.id}" data-turno="manha"> Manhã</label>
        <label><input type="checkbox" data-dia="${d.id}" data-turno="tarde"> Tarde</label>
        <label><input type="checkbox" data-dia="${d.id}" data-turno="noite"> Noite</label>
      </div>
    `;
    container.appendChild(card);
  });
}

function extrairTurnosMarcados() {
  const checkboxes = document.querySelectorAll('#turnos-selector input[type="checkbox"]:checked');
  const mapa = {};
  checkboxes.forEach(cb => {
    const dia = parseInt(cb.dataset.dia, 10);
    const turno = cb.dataset.turno;
    if (!mapa[dia]) mapa[dia] = [];
    mapa[dia].push(turno);
  });

  return Object.keys(mapa).map(dia => ({
    dia: parseInt(dia, 10),
    periodos: mapa[dia]
  }));
}

function marcarTurnosNoSeletor(indisponibilidades = []) {
  document.querySelectorAll('#turnos-selector input[type="checkbox"]').forEach(cb => cb.checked = false);
  indisponibilidades.forEach(item => {
    item.periodos.forEach(p => {
      const cb = document.querySelector(`#turnos-selector input[data-dia="${item.dia}"][data-turno="${p}"]`);
      if (cb) cb.checked = true;
    });
  });
}

function obterPeriodo(horarioStr) {
  if (!horarioStr) return 'indefinido';
  const str = horarioStr.toLowerCase();
  const match = str.match(/(\d{1,2})/);
  if (match) {
    const hora = parseInt(match[1], 10);
    if (hora < 12) return 'manha';
    if (hora >= 12 && hora < 18) return 'tarde';
    return 'noite';
  }
  if (str.includes('noite')) return 'noite';
  if (str.includes('tarde')) return 'tarde';
  if (str.includes('manhã') || str.includes('manha')) return 'manha';
  return 'indefinido';
}

function verificarConflito(voluntarioId, dataEvento, horarioEvento, nomeProjeto = '') {
  if (!voluntarioId || !dataEvento) return false;
  const vol = voluntarios.find(v => v.id === voluntarioId);
  if (!vol) return false;

  if (vol.tipo === 'parada') {
    const proj = (nomeProjeto || '').toLowerCase();
    return !proj.includes('parada social');
  }

  if (!vol.indisponibilidadeSemanal) return false;

  const [y, m, d] = dataEvento.split('-').map(Number);
  const diaSemana = new Date(y, m - 1, d).getDay();
  const periodoEvento = obterPeriodo(horarioEvento);

  const regraDia = vol.indisponibilidadeSemanal.find(r => r.dia === diaSemana);
  if (!regraDia) return false;

  if (periodoEvento === 'indefinido') {
    return regraDia.periodos.length > 0;
  }
  return regraDia.periodos.includes(periodoEvento);
}

function formatarDataBR(dataISO) {
  if (!dataISO) return '—';
  const partes = dataISO.split('-');
  if (partes.length !== 3) return dataISO;
  const [y, m, d] = partes;
  return `${d.padStart(2, '0')}/${m.padStart(2, '0')}/${y}`;
}

function gerarLinkWhatsApp(voluntarioId, evento, papel) {
  const vol = voluntarios.find(v => v.id === voluntarioId);
  if (!vol || !vol.telefone) return null;

  const numLimpo = vol.telefone.replace(/\D/g, '');
  if (!numLimpo) return null;

  const numCompleto = numLimpo.startsWith('55') ? numLimpo : '55' + numLimpo;
  const dataFmt = formatarDataBR(evento.data);

  const msg = `Olá, ${vol.nome}! Você foi escalado para a escala de comunicação para o projeto *${evento.projeto}* no dia *${dataFmt}* (${evento.horario || 'horário a combinar'}), local: *${evento.local || 'a combinar'}*, na função de *${papel}*. Você confirma a presença?`;

  return `https://wa.me/${numCompleto}?text=${encodeURIComponent(msg)}`;
}

function toggleConfirmacao(eventoId, campoConf) {
  const ev = eventos.find(e => e.id === eventoId);
  if (ev) {
    ev[campoConf] = !ev[campoConf];
    salvarNaNuvem();
    renderPlanilha();
  }
}

function renderPlanilha() {
  const tbody = document.getElementById('planilha-tbody');
  tbody.innerHTML = '';

  const diasSemana = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

  eventos.forEach(ev => {
    const tr = document.createElement('tr');

    let diaFormatado = '—';
    if (ev.data) {
      const [y, m, d] = ev.data.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const dStr = String(d).padStart(2, '0');
      const mStr = String(m).padStart(2, '0');
      diaFormatado = `${diasSemana[dt.getDay()]} ${dStr}/${mStr}/${y}`;
    }

    const cFoto = verificarConflito(ev.volFoto, ev.data, ev.horario, ev.projeto);
    const cRede = verificarConflito(ev.volRede, ev.data, ev.horario, ev.projeto);
    const cVideo = verificarConflito(ev.volVideo, ev.data, ev.horario, ev.projeto);

    const wppFoto = ev.volFoto ? gerarLinkWhatsApp(ev.volFoto, ev, 'Fotografia') : null;
    const wppRede = ev.volRede ? gerarLinkWhatsApp(ev.volRede, ev, 'Rede Social') : null;
    const wppVideo = ev.volVideo ? gerarLinkWhatsApp(ev.volVideo, ev, 'Vídeo') : null;

    tr.innerHTML = `
      <td><strong>${diaFormatado}</strong></td>
      <td>${ev.projeto}</td>
      <td>${ev.horario}</td>
      <td>${ev.local}</td>
      
      <!-- Coluna FOTO -->
      <td>
        <div class="slot-cell">
          <select class="cell-select ${cFoto ? 'has-conflict' : ''} ${ev.confFoto ? 'is-confirmed' : ''}" onchange="atualizarSlot('${ev.id}', 'volFoto', this.value)">
            ${getOptionsVoluntarios(ev.volFoto)}
          </select>
          ${ev.volFoto ? `
            <button class="btn-check ${ev.confFoto ? 'active' : ''}" onclick="toggleConfirmacao('${ev.id}', 'confFoto')" title="Marcar como Confirmado">✓</button>
            ${wppFoto ? `<a href="${wppFoto}" target="_blank" class="btn-wpp" title="Confirmar via WhatsApp">💬</a>` : ''}
          ` : ''}
        </div>
      </td>

      <!-- Coluna REDE SOCIAL -->
      <td>
        <div class="slot-cell">
          <select class="cell-select ${cRede ? 'has-conflict' : ''} ${ev.confRede ? 'is-confirmed' : ''}" onchange="atualizarSlot('${ev.id}', 'volRede', this.value)">
            ${getOptionsVoluntarios(ev.volRede)}
          </select>
          ${ev.volRede ? `
            <button class="btn-check ${ev.confRede ? 'active' : ''}" onclick="toggleConfirmacao('${ev.id}', 'confRede')" title="Marcar como Confirmado">✓</button>
            ${wppRede ? `<a href="${wppRede}" target="_blank" class="btn-wpp" title="Confirmar via WhatsApp">💬</a>` : ''}
          ` : ''}
        </div>
      </td>

      <!-- Coluna VÍDEO -->
      <td>
        <div class="slot-cell">
          <select class="cell-select ${cVideo ? 'has-conflict' : ''} ${ev.confVideo ? 'is-confirmed' : ''}" onchange="atualizarSlot('${ev.id}', 'volVideo', this.value)">
            ${getOptionsVoluntarios(ev.volVideo)}
          </select>
          ${ev.volVideo ? `
            <button class="btn-check ${ev.confVideo ? 'active' : ''}" onclick="toggleConfirmacao('${ev.id}', 'confVideo')" title="Marcar como Confirmado">✓</button>
            ${wppVideo ? `<a href="${wppVideo}" target="_blank" class="btn-wpp" title="Confirmar via WhatsApp">💬</a>` : ''}
          ` : ''}
        </div>
      </td>

      <td>
        <button class="btn danger" style="padding:2px 6px;font-size:11px;" onclick="deletarEvento('${ev.id}')">✕</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function getOptionsVoluntarios(selecionadoId) {
  let opts = '<option value="">-- Vazio --</option>';
  const disponiveis = voluntarios.filter(v => v.tipo !== 'edicao');

  disponiveis.sort((a,b)=>a.nome.localeCompare(b.nome)).forEach(v => {
    const sel = v.id === selecionadoId ? 'selected' : '';
    opts += `<option value="${v.id}" ${sel}>${v.nome}</option>`;
  });
  return opts;
}

function atualizarSlot(eventoId, campo, novoVolId) {
  const ev = eventos.find(e => e.id === eventoId);
  if (ev) {
    ev[campo] = novoVolId;
    if (campo === 'volFoto') ev.confFoto = false;
    if (campo === 'volRede') ev.confRede = false;
    if (campo === 'volVideo') ev.confVideo = false;

    salvarNaNuvem();
    renderPlanilha();
  }
}

function addEventoLinha() {
  const data = document.getElementById('ev-data').value;
  const projeto = document.getElementById('ev-projeto').value.trim();
  const horario = document.getElementById('ev-horario').value.trim();
  const local = document.getElementById('ev-local').value.trim();

  if (!projeto) return alert('Preencha o nome do Projeto.');

  eventos.push({
    id: 'ev-' + Date.now(),
    data,
    projeto,
    horario,
    local,
    volFoto: '', confFoto: false,
    volRede: '', confRede: false,
    volVideo: '', confVideo: false
  });

  ordenarEventosPorData();
  salvarNaNuvem();
  renderPlanilha();

  document.getElementById('ev-data').value = '';
  document.getElementById('ev-projeto').value = '';
  document.getElementById('ev-horario').value = '';
  document.getElementById('ev-local').value = '';
}

function deletarEvento(id) {
  if (!confirm('Remover esta linha de evento?')) return;
  eventos = eventos.filter(e => e.id !== id);
  salvarNaNuvem();
  renderPlanilha();
}

/* CRUD de Voluntários */
function salvarVoluntario() {
  const nome = document.getElementById('vol-nome').value.trim();
  const tel = document.getElementById('vol-tel').value.trim();
  const funcoesStr = document.getElementById('vol-funcoes').value.trim();
  const tipo = document.getElementById('vol-edicao').value;
  const obs = document.getElementById('vol-obs').value.trim();
  const indisponibilidade = extrairTurnosMarcados();

  if (!nome) return alert('Digite o nome do voluntário.');

  const funcoes = funcoesStr ? funcoesStr.split(',').map(s=>s.trim()).filter(Boolean) : [];

  if (editingVolId) {
    const v = voluntarios.find(item => item.id === editingVolId);
    if (v) {
      v.nome = nome;
      v.telefone = tel;
      v.funcoes = funcoes;
      v.tipo = tipo;
      v.regraDesc = obs;
      v.indisponibilidadeSemanal = indisponibilidade;
    }
    cancelarEdicaoVoluntario();
  } else {
    voluntarios.push({
      id: 'vol-' + Date.now(),
      nome,
      telefone: tel,
      funcoes,
      tipo,
      regraDesc: obs,
      indisponibilidadeSemanal: indisponibilidade
    });
    limparFormVoluntario();
  }

  salvarNaNuvem();
  renderVoluntarios();
  renderPlanilha();
}

function editarVoluntario(id) {
  const v = voluntarios.find(item => item.id === id);
  if (!v) return;

  editingVolId = id;
  document.getElementById('vol-form-title').textContent = 'Editar Voluntário: ' + v.nome;
  document.getElementById('vol-nome').value = v.nome;
  document.getElementById('vol-tel').value = v.telefone || '';
  document.getElementById('vol-funcoes').value = (v.funcoes || []).join(', ');
  document.getElementById('vol-edicao').value = v.tipo || 'campo';
  document.getElementById('vol-obs').value = v.regraDesc || '';

  marcarTurnosNoSeletor(v.indisponibilidadeSemanal || []);

  document.getElementById('vol-submit-btn').textContent = 'Salvar Alterações';
  document.getElementById('vol-cancel-btn').style.display = 'inline-block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelarEdicaoVoluntario() {
  editingVolId = null;
  limparFormVoluntario();
  document.getElementById('vol-form-title').textContent = 'Cadastrar Novo Voluntário';
  document.getElementById('vol-submit-btn').textContent = 'Cadastrar Voluntário';
  document.getElementById('vol-cancel-btn').style.display = 'none';
}

function limparFormVoluntario() {
  document.getElementById('vol-nome').value = '';
  document.getElementById('vol-tel').value = '';
  document.getElementById('vol-funcoes').value = '';
  document.getElementById('vol-edicao').value = 'campo';
  document.getElementById('vol-obs').value = '';
  marcarTurnosNoSeletor([]);
}

function deletarVoluntario(id) {
  if (!confirm('Excluir este voluntário?')) return;
  voluntarios = voluntarios.filter(v => v.id !== id);
  salvarNaNuvem();
  renderVoluntarios();
  renderPlanilha();
}

function renderVoluntarios() {
  const container = document.getElementById('voluntarios-list');
  container.innerHTML = '';

  voluntarios.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).forEach(v => {
    const card = document.createElement('div');
    card.className = 'vol-card';

    const tagsHtml = (v.funcoes && v.funcoes.length)
      ? v.funcoes.map(f => `<span class="tag">${f}</span>`).join('')
      : '<span class="tag-neutral">Geral</span>';

    let tipoTag = '';
    if (v.tipo === 'edicao') tipoTag = `<span class="tag-neutral" style="background:#5b21b6;">Apenas Edição</span>`;
    if (v.tipo === 'parada') tipoTag = `<span class="tag-neutral" style="background:#065f46;">Apenas Parada Social</span>`;

    const telTexto = v.telefone ? `📱 ${v.telefone}` : '<span style="opacity:0.5;">Sem telefone cadastrado</span>';

    const restricoesTexto = v.regraDesc 
      ? `<div style="font-size:11px;color:var(--red-text);margin-top:8px;line-height:1.4;">${v.regraDesc}</div>`
      : `<div style="font-size:11px;color:var(--text-dim);margin-top:8px;">Disponível / Sem restrições</div>`;

    card.innerHTML = `
      <div style="font-weight:700;font-size:15px;margin-bottom:2px;">${v.nome}</div>
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;">${telTexto}</div>
      <div style="margin-bottom:6px;">${tagsHtml} ${tipoTag}</div>
      <div style="background:var(--bg);padding:8px;border-radius:4px;margin:8px 0;">${restricoesTexto}</div>
      <div class="vol-actions">
        <button class="btn secondary" style="padding:4px 10px;font-size:11px;" onclick="editarVoluntario('${v.id}')">Editar</button>
        <button class="btn danger" style="padding:4px 10px;font-size:11px;" onclick="deletarVoluntario('${v.id}')">Excluir</button>
      </div>
    `;
    container.appendChild(card);
  });
}

function exportCSV() {
  let csv = 'Data;Projeto;Horario;Local;Foto;Rede Social;Video\n';
  eventos.forEach(e => {
    const dataFormatada = formatarDataBR(e.data);
    const f = voluntarios.find(v => v.id === e.volFoto)?.nome || '';
    const r = voluntarios.find(v => v.id === e.volRede)?.nome || '';
    const vd = voluntarios.find(v => v.id === e.volVideo)?.nome || '';
    csv += `"${dataFormatada}";"${e.projeto}";"${e.horario}";"${e.local}";"${f}";"${r}";"${vd}"\n`;
  });
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'escala-midia.csv';
  a.click();
}

init();
